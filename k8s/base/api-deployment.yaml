apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultai-api
  labels:
    app: vaultai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaultai-api
  template:
    metadata:
      labels:
        app: vaultai-api
    spec:
      containers:
        - name: vaultai-api
          image: vaultai-api:build-1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: vaultai-secrets
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: vaultai-api-service
spec:
  selector:
    app: vaultai-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
