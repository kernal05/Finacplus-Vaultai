apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vaultai-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: vaultai-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: vaultai-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

labels:
  - pairs:
      environment: staging
    includeSelectors: false
