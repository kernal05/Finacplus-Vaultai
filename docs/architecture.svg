<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="650" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#222">VaultAI CI/CD architecture: Git, Jenkins, Kubernetes</text>
  <text x="30" y="62" font-size="12" fill="#777">Trigger path</text>

  <!-- Trigger row -->
  <g stroke="#888" fill="#F1EFE8" stroke-width="1">
    <rect x="30" y="75" width="150" height="50" rx="6"/>
    <rect x="300" y="75" width="150" height="50" rx="6"/>
  </g>
  <rect x="870" y="75" width="200" height="50" rx="6" fill="#E6F1FB" stroke="#378ADD"/>
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="105" y="97" font-weight="bold">Developer</text><text x="105" y="114" font-size="11" fill="#666">git push to main</text>
    <text x="375" y="97" font-weight="bold">GitHub</text><text x="375" y="114" font-size="11" fill="#666">repository</text>
    <text x="970" y="97" font-weight="bold" fill="#0C447C">Jenkins</text><text x="970" y="114" font-size="11" fill="#0C447C">Docker container, port 8090</text>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="180" y1="100" x2="298" y2="100"/>
    <line x1="450" y1="100" x2="868" y2="100"/>
    <line x1="970" y1="125" x2="970" y2="168"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="239" y="92">push</text><text x="659" y="92">webhook (push event)</text>
  </g>

  <!-- Pipeline -->
  <rect x="20" y="170" width="1060" height="250" rx="10" fill="#FAFAFA" stroke="#BBB"/>
  <text x="40" y="193" font-size="13" font-weight="bold" fill="#333">Jenkins multibranch pipeline (Jenkinsfile: Declarative + Groovy helpers)</text>

  <g stroke="#888" fill="#F1EFE8">
    <rect x="40" y="210" width="120" height="50" rx="6"/>
    <rect x="190" y="210" width="150" height="50" rx="6"/>
    <rect x="370" y="210" width="150" height="50" rx="6"/>
  </g>
  <g stroke="#378ADD" fill="#E6F1FB">
    <rect x="550" y="210" width="150" height="50" rx="6"/>
    <rect x="730" y="210" width="130" height="50" rx="6"/>
    <rect x="890" y="210" width="150" height="50" rx="6"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="100" y="232" font-weight="bold">Checkout</text><text x="100" y="249" font-size="11" fill="#666">tag build-N-sha</text>
    <text x="265" y="232" font-weight="bold">Build images</text><text x="265" y="249" font-size="11" fill="#666">api + web</text>
    <text x="445" y="232" font-weight="bold">Load into Minikube</text><text x="445" y="249" font-size="11" fill="#666">stands in for a registry</text>
    <text x="625" y="232" font-weight="bold" fill="#0C447C">Sync staging secret</text><text x="625" y="249" font-size="11" fill="#0C447C">before the deploy</text>
    <text x="795" y="232" font-weight="bold" fill="#0C447C">Deploy staging</text><text x="795" y="249" font-size="11" fill="#0C447C">auto-rollback</text>
    <text x="965" y="232" font-weight="bold" fill="#0C447C">Staging smoke test</text><text x="965" y="249" font-size="11" fill="#0C447C">health checks</text>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="160" y1="235" x2="188" y2="235"/>
    <line x1="340" y1="235" x2="368" y2="235"/>
    <line x1="520" y1="235" x2="548" y2="235"/>
    <line x1="700" y1="235" x2="728" y2="235"/>
    <line x1="860" y1="235" x2="888" y2="235"/>
    <line x1="965" y1="260" x2="965" y2="328"/>
  </g>

  <!-- Row 2 -->
  <rect x="890" y="330" width="150" height="50" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <g stroke="#639922" fill="#EAF3DE">
    <rect x="710" y="330" width="130" height="50" rx="6"/>
    <rect x="550" y="330" width="120" height="50" rx="6"/>
    <rect x="380" y="330" width="120" height="50" rx="6"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="965" y="352" font-weight="bold" fill="#633806">Approval gate</text><text x="965" y="369" font-size="11" fill="#633806">30 min, no executor held</text>
    <text x="775" y="352" font-weight="bold" fill="#27500A">Sync prod secret</text><text x="775" y="369" font-size="11" fill="#27500A">before the deploy</text>
    <text x="610" y="352" font-weight="bold" fill="#27500A">Deploy prod</text><text x="610" y="369" font-size="11" fill="#27500A">same image tag</text>
    <text x="440" y="352" font-weight="bold" fill="#27500A">Prod smoke test</text><text x="440" y="369" font-size="11" fill="#27500A">health checks</text>
    <text x="965" y="402" font-size="11" fill="#777">default choice: skip production</text>
  </g>
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="890" y1="355" x2="842" y2="355"/>
    <line x1="710" y1="355" x2="672" y2="355"/>
    <line x1="550" y1="355" x2="502" y2="355"/>
  </g>

  <!-- Cluster -->
  <rect x="20" y="450" width="1060" height="160" rx="10" fill="#FAFAFA" stroke="#BBB"/>
  <text x="40" y="474" font-size="13" font-weight="bold" fill="#333">Kubernetes (Minikube), environments built from Kustomize overlays</text>
  <rect x="40" y="492" width="290" height="100" rx="6" fill="#FCEBEB" stroke="#E24B4A"/>
  <g font-size="12" text-anchor="middle" fill="#791F1F">
    <text x="185" y="514" font-weight="bold" font-size="13">Failure path</text>
    <text x="185" y="535">Rollout not ready within 180 s</text>
    <text x="185" y="553">kubectl rollout undo, all components</text>
    <text x="185" y="571">Build fails, prod is never reached</text>
  </g>
  <rect x="380" y="492" width="260" height="100" rx="6" fill="#EAF3DE" stroke="#639922"/>
  <g font-size="12" text-anchor="middle" fill="#27500A">
    <text x="510" y="516" font-weight="bold" font-size="13">namespace: vaultai-prod</text>
    <text x="510" y="539">api x3, web x3</text>
    <text x="510" y="560" font-size="11">k8s/overlays/prod</text>
  </g>
  <rect x="660" y="492" width="220" height="100" rx="6" fill="#E6F1FB" stroke="#378ADD"/>
  <g font-size="12" text-anchor="middle" fill="#0C447C">
    <text x="770" y="516" font-weight="bold" font-size="13">vaultai-staging</text>
    <text x="770" y="539">api x2, web x2</text>
    <text x="770" y="560" font-size="11">k8s/overlays/staging</text>
  </g>
  <rect x="900" y="492" width="160" height="100" rx="6" fill="#F1EFE8" stroke="#888"/>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="980" y="516" font-weight="bold" font-size="13">k8s/base</text>
    <text x="980" y="539">shared Deployments</text>
    <text x="980" y="557">and Services</text>
    <text x="980" y="575" font-size="11">(Kustomize)</text>
  </g>

  <!-- Deploy arrows into the cluster -->
  <g stroke="#555" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)">
    <line x1="850" y1="260" x2="850" y2="488"/>
    <line x1="610" y1="380" x2="610" y2="488"/>
  </g>

    <text x="30" y="635" font-size="12" fill="#666">One image per commit (build-N-commit) is built once and promoted from staging to prod. Credentials live in Jenkins, never in the repo.</text>
</svg>
